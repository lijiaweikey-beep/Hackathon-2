<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal Catcher</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #20242d;
      --line: #343b47;
      --text: #f5f6f8;
      --muted: #a9b0bd;
      --mint: #69f0bd;
      --gold: #ffd166;
      --coral: #ff6b6b;
      --blue: #72a7ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      touch-action: none;
      user-select: none;
    }

    button {
      border: 0;
      border-radius: 8px;
      min-height: 46px;
      padding: 0 18px;
      color: #12151a;
      background: var(--mint);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      color: var(--text);
      background: #303743;
    }

    .app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: max(14px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 22% 18%, rgba(105, 240, 189, 0.18), transparent 28%),
        radial-gradient(circle at 82% 8%, rgba(255, 209, 102, 0.16), transparent 26%),
        linear-gradient(180deg, #171a21 0%, #101218 100%);
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      z-index: 2;
    }

    .metric {
      min-height: 60px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: rgba(32, 36, 45, 0.88);
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 21px;
      font-weight: 800;
      line-height: 1;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        #161a22;
      background-size: 32px 32px;
    }

    .target {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76px;
      height: 76px;
      border: 3px solid rgba(255, 255, 255, 0.86);
      border-radius: 50%;
      background:
        radial-gradient(circle, #ffffff 0 12%, var(--gold) 13% 36%, var(--coral) 37% 62%, transparent 63%);
      box-shadow: 0 0 22px rgba(255, 209, 102, 0.6);
      transform: translate(-50%, -50%) scale(1);
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .target.pulse {
      transform: translate(-50%, -50%) scale(0.82);
      opacity: 0.72;
    }

    .spark {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mint);
      opacity: 0;
      transform: translate(-50%, -50%);
      animation: spark 560ms ease-out forwards;
    }

    .tip {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--muted);
      background: rgba(17, 19, 24, 0.74);
      font-size: 13px;
      line-height: 1.45;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(8, 10, 14, 0.72);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      z-index: 10;
      transition: opacity 160ms ease, visibility 160ms ease;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-card {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      background: #20242d;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
    }

    .modal-title {
      margin: 0;
      font-size: 25px;
      line-height: 1.18;
    }

    .modal-message {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .result-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .result-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #171b22;
    }

    .result-value {
      margin-top: 5px;
      color: var(--gold);
      font-size: 24px;
      font-weight: 800;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      z-index: 12;
      min-width: 160px;
      max-width: calc(100% - 36px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      background: rgba(28, 32, 40, 0.94);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes spark {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -120%) scale(3.8);
      }
    }

    @media (max-width: 360px) {
      .metric {
        min-height: 54px;
        padding: 8px;
      }

      .metric-value {
        font-size: 18px;
      }

      .target {
        width: 68px;
        height: 68px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Signal Catcher">
    <section class="topbar" aria-label="挑战数据">
      <div class="metric">
        <div class="metric-label">得分</div>
        <div id="score-value" class="metric-value">0</div>
      </div>
      <div class="metric">
        <div class="metric-label">剩余</div>
        <div id="time-value" class="metric-value">30</div>
      </div>
      <div class="metric">
        <div class="metric-label">连击</div>
        <div id="combo-value" class="metric-value">0</div>
      </div>
    </section>

    <section id="stage" class="stage" aria-label="互动区域">
      <button id="target" class="target" type="button" aria-label="捕捉光点"></button>
      <div class="tip">点中光点获得分数，连续命中会提高奖励。30 秒后自动结算。</div>
    </section>
  </main>

  <section id="screen-start" class="screen active" aria-hidden="false">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="start-title">
      <h1 id="start-title" class="modal-title">Signal Catcher</h1>
      <p class="modal-message">在限定时间内捕捉跳动光点。节奏越稳，连击越高，最终得分越漂亮。</p>
      <div class="modal-actions">
        <button id="start-button" type="button">开始挑战</button>
      </div>
    </div>
  </section>

  <section id="screen-result" class="screen" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <h2 id="result-title" class="modal-title">挑战完成</h2>
      <p id="result-message" class="modal-message">这次节奏不错。</p>
      <div class="result-list" aria-label="结算数据">
        <div class="result-item">
          <div class="metric-label">本次得分</div>
          <div id="final-score" class="result-value">0</div>
        </div>
        <div class="result-item">
          <div class="metric-label">最高纪录</div>
          <div id="best-score" class="result-value">0</div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="again-button" type="button">再来一次</button>
        <button id="close-button" class="secondary" type="button">查看场地</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "interact_signal_catcher_best_score";
      var ROUND_SECONDS = 30;
      var state = {
        active: false,
        score: 0,
        combo: 0,
        timeLeft: ROUND_SECONDS,
        lastHitAt: 0,
        timerId: 0,
        toastId: 0
      };

      function byId(id) {
        return document.getElementById(id);
      }

      var els = {
        stage: byId("stage"),
        target: byId("target"),
        score: byId("score-value"),
        time: byId("time-value"),
        combo: byId("combo-value"),
        start: byId("screen-start"),
        result: byId("screen-result"),
        startButton: byId("start-button"),
        againButton: byId("again-button"),
        closeButton: byId("close-button"),
        finalScore: byId("final-score"),
        bestScore: byId("best-score"),
        resultMessage: byId("result-message"),
        toast: byId("toast")
      };

      function hideAllScreens() {
        var screens = document.querySelectorAll(".screen");
        for (var i = 0; i < screens.length; i += 1) {
          screens[i].classList.remove("active");
          screens[i].setAttribute("aria-hidden", "true");
        }
      }

      function showScreen(id) {
        hideAllScreens();
        var screen = byId(id);
        if (!screen) {
          return;
        }
        screen.classList.add("active");
        screen.setAttribute("aria-hidden", "false");
      }

      function getBestScore() {
        try {
          return Number(localStorage.getItem(STORAGE_KEY) || "0");
        } catch (error) {
          return 0;
        }
      }

      function saveBestScore(value) {
        try {
          localStorage.setItem(STORAGE_KEY, String(value));
        } catch (error) {
          showToast("纪录保存失败，本轮仍可继续体验");
        }
      }

      function render() {
        els.score.textContent = String(state.score);
        els.time.textContent = String(state.timeLeft);
        els.combo.textContent = String(state.combo);
      }

      function randomTarget() {
        var rect = els.stage.getBoundingClientRect();
        var size = Math.max(60, Math.min(84, rect.width * 0.22));
        var padding = size / 2 + 12;
        var x = padding + Math.random() * Math.max(1, rect.width - padding * 2);
        var y = padding + Math.random() * Math.max(1, rect.height - padding * 2 - 48);
        els.target.style.width = size + "px";
        els.target.style.height = size + "px";
        els.target.style.left = x + "px";
        els.target.style.top = y + "px";
      }

      function createSpark(x, y) {
        var spark = document.createElement("span");
        spark.className = "spark";
        spark.style.left = x + "px";
        spark.style.top = y + "px";
        els.stage.appendChild(spark);
        window.setTimeout(function () {
          if (spark.parentNode) {
            spark.parentNode.removeChild(spark);
          }
        }, 620);
      }

      function showToast(text) {
        window.clearTimeout(state.toastId);
        els.toast.textContent = text;
        els.toast.classList.add("show");
        state.toastId = window.setTimeout(function () {
          els.toast.classList.remove("show");
        }, 1200);
      }

      function finishRound() {
        state.active = false;
        window.clearInterval(state.timerId);
        var best = getBestScore();
        var newBest = Math.max(best, state.score);
        if (newBest > best) {
          saveBestScore(newBest);
          els.resultMessage.textContent = "新纪录出现了，手感很稳。";
        } else {
          els.resultMessage.textContent = "本轮完成，再调整节奏试试。";
        }
        els.finalScore.textContent = String(state.score);
        els.bestScore.textContent = String(newBest);
        showScreen("screen-result");
      }

      function startRound() {
        state.active = true;
        state.score = 0;
        state.combo = 0;
        state.timeLeft = ROUND_SECONDS;
        state.lastHitAt = 0;
        window.clearInterval(state.timerId);
        hideAllScreens();
        render();
        randomTarget();
        state.timerId = window.setInterval(function () {
          state.timeLeft -= 1;
          render();
          if (state.timeLeft <= 0) {
            finishRound();
          }
        }, 1000);
      }

      function hitTarget(event) {
        if (!state.active) {
          return;
        }
        var now = Date.now();
        state.combo = now - state.lastHitAt < 950 ? state.combo + 1 : 1;
        state.lastHitAt = now;
        state.score += 10 + Math.min(8, state.combo) * 2;
        els.target.classList.add("pulse");
        window.setTimeout(function () {
          els.target.classList.remove("pulse");
        }, 120);
        var stageRect = els.stage.getBoundingClientRect();
        createSpark(event.clientX - stageRect.left, event.clientY - stageRect.top);
        render();
        randomTarget();
      }

      function closeResult() {
        hideAllScreens();
        showToast("点击“再来一次”可刷新挑战");
      }

      function initApp() {
        render();
        randomTarget();
        els.startButton.addEventListener("click", startRound);
        els.againButton.addEventListener("click", startRound);
        els.closeButton.addEventListener("click", closeResult);
        els.target.addEventListener("pointerdown", hitTarget);
        window.addEventListener("resize", randomTarget);
        document.addEventListener("visibilitychange", function () {
          if (document.hidden && state.active) {
            finishRound();
          }
        });
      }

      window.addEventListener("load", function () {
        try {
          initApp();
        } catch (error) {
          var fallback = document.createElement("div");
          fallback.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-size:18px;padding:24px;text-align:center;z-index:9999;";
          fallback.textContent = "页面启动失败，请重新打开体验。";
          while (document.body.firstChild) {
            document.body.removeChild(document.body.firstChild);
          }
          document.body.appendChild(fallback);
        }
      });
    }());
  </script>
</body>
</html>
