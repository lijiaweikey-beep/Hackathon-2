<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>梗哥的半生</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <section id="orientationOverlay" class="orientation-overlay" hidden>
      <div class="orientation-card">
        <div class="orientation-phone" aria-hidden="true">📱</div>
        <strong>请横屏游玩</strong>
        <span>旋转手机，继续梗哥的人生</span>
      </div>
    </section>
    <div id="damageFlash" class="damage-flash" aria-hidden="true"></div>
    <canvas id="gameCanvas" aria-label="3D top-down action game"></canvas>

    <main id="hud" class="hud" aria-label="游戏界面">
      <section class="topbar">
        <div class="mission-strip">
          <div id="sceneName" class="scene-name">凌晨三点</div>
          <div id="missionText" class="mission-text">任务加载中</div>
          <div id="mechanicHint" class="mechanic-hint" aria-live="polite"></div>
        </div>
        <div class="status-strip">
          <div class="status-chip">
            <span class="status-label">时间</span>
            <strong id="timerText">90</strong>
          </div>
          <div class="status-chip danger">
            <span id="attemptLabel" class="status-label">出拳</span>
            <strong id="attemptText">3</strong>
          </div>
          <button id="pauseButton" class="pause-button" type="button" aria-label="暂停">⏸</button>
        </div>
      </section>

      <div class="clue-bar-wrap">
        <div id="clueBar" class="clue-bar">🔍 目标特征加载中</div>
      </div>

      <section class="controls">
        <div id="joystick" class="joystick" aria-label="虚拟摇杆">
          <div id="joystickKnob" class="joystick-knob"></div>
        </div>
        <button id="attackButton" class="attack-button" type="button" aria-label="干爆">
          <span>拳</span>
          <div id="cooldownOverlay" class="cooldown-overlay"></div>
        </button>
      </section>
    </main>

    <!-- 暂停弹窗 -->
    <section id="pauseModal" class="modal">
      <div class="modal-panel">
        <div class="modal-title">⏸ 暂停</div>
        <p class="modal-copy" style="font-size:15px;color:var(--muted)">游戏已暂停</p>
        <div class="task-actions">
          <button id="resumeButton" class="primary-button" type="button">继续游戏</button>
          <button id="backFromPauseButton" class="secondary-button" type="button">返回选关</button>
        </div>
      </div>
    </section>

    <!-- 关卡选择界面 -->
    <section id="levelSelectModal" class="modal visible">
      <div id="levelSelectPanel" class="level-select-panel">
        <header class="level-select-header">
          <div class="game-kicker"><span aria-hidden="true"></span>一拳解压人生</div>
          <div id="gameLogo" class="game-logo">梗哥的半生</div>
          <p class="level-select-tagline">从十九岁的宿舍，一拳打到三十岁的生活</p>
          <div id="lifeTimeline" class="life-timeline" aria-label="梗哥的人生年龄线"></div>
          <div class="level-select-tags">
            <span class="level-tag">单人剧情</span>
            <span class="level-tag">人生闯关</span>
            <span class="level-tag">一拳解压</span>
          </div>
        </header>

        <div id="soloModeStack" class="level-select-stack">
          <div class="match-settings">
            <div class="match-settings-icon" aria-hidden="true">👥</div>
            <div class="match-settings-body">
              <label class="match-settings-label" for="npcCountInput">对局人数</label>
              <div class="match-settings-row">
                <div class="match-settings-input-wrap">
                  <input
                    id="npcCountInput"
                    class="match-settings-input"
                    type="number"
                    min="10"
                    max="100"
                    step="1"
                    value="20"
                    inputmode="numeric"
                    aria-describedby="npcCountHint"
                  />
                </div>
                <span id="npcCountHint" class="match-settings-hint">10–100 人（多点用）</span>
                <div class="match-settings-arrows">
                  <button class="match-settings-arrow up" type="button" aria-label="增加人数">↑</button>
                  <button class="match-settings-arrow down" type="button" aria-label="减少人数">↓</button>
                </div>
              </div>
            </div>
          </div>
          <p class="level-section-label">人生主线 · 逐关解锁</p>
          <div id="levelCards" class="level-cards">
            <!-- 关卡卡片将通过JavaScript动态生成 -->
          </div>
          <div class="level-section-divider">人生之外</div>
          <p class="level-section-label extra">番外关卡 · 随时可玩</p>
          <div id="extraLevelCards" class="level-cards"></div>
        </div>
      </div>
    </section>

    <!-- 任务简报弹窗 -->
    <section id="taskModal" class="modal">
      <div class="modal-panel task-panel">
        <div id="taskEmoji" class="task-emoji">🌙</div>
        <div id="taskTitle" class="modal-title">任务</div>
        <div class="target-preview-wrap">
          <canvas id="targetPreviewCanvas" class="target-preview-canvas" width="200" height="220"></canvas>
          <div id="targetLabel" class="target-label">目标</div>
        </div>
        <p id="taskCopy" class="modal-copy task-mission">任务加载中</p>
        <div id="taskClue" class="task-clue">🔍 线索加载中</div>
        <div class="task-info-row">
          <div class="task-info-chip">👥 <span id="taskNpcCount">20</span> 人</div>
          <div class="task-info-chip">⏱ <span id="taskTime">90</span> 秒</div>
          <div class="task-info-chip" id="taskAttemptsChip">❤️ <span id="taskAttempts">❤️❤️❤️</span></div>
        </div>
        <div class="task-controls-guide">
          <div class="guide-item"><span class="guide-icon">🕹</span> 摇杆/WASD 移动</div>
          <div class="guide-item"><span class="guide-icon">👊</span> 拳按钮/空格 攻击</div>
        </div>
        <div class="task-actions">
          <button id="backFromTaskButton" class="secondary-button" type="button">返回选关</button>
          <button id="startButton" class="primary-button" type="button">开始行动</button>
        </div>
      </div>
    </section>

    <!-- 结算弹窗 -->
    <section id="resultModal" class="modal">
      <div class="modal-panel result-panel">
        <div id="resultRating" class="result-rating">S</div>
        <div id="resultTitle" class="modal-title">结算</div>
        <p id="resultCopy" class="modal-copy">结果加载中</p>
        <div class="result-stats">
          <div class="stat-row"><span>⏱ 用时</span><strong id="statTime">--</strong></div>
          <div class="stat-row"><span id="statAttemptsLabel">🥊 剩余出拳</span><strong id="statAttempts">--</strong></div>
        </div>
        <div class="result-actions">
          <button id="retryButton" class="primary-button" type="button">再来一局</button>
          <button id="backToSelectButton" class="secondary-button" type="button">返回选关</button>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
