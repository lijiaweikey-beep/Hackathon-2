<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>梗哥的半生</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <section id="orientationOverlay" class="orientation-overlay" hidden>
      <div class="orientation-card">
        <div class="orientation-phone" aria-hidden="true">📱</div>
        <strong>请横屏游玩</strong>
        <span>旋转手机，继续梗哥的人生</span>
      </div>
    </section>
    <div id="damageFlash" class="damage-flash" aria-hidden="true"></div>
    <canvas id="gameCanvas" aria-label="3D top-down action experience"></canvas>

    <main id="hud" class="hud" aria-label="互动界面">
      <section class="topbar">
        <div class="mission-strip">
          <div id="sceneName" class="scene-name">凌晨三点</div>
          <div id="missionText" class="mission-text">任务加载中</div>
          <div id="mechanicHint" class="mechanic-hint" aria-live="polite"></div>
        </div>
        <div class="clue-bar-wrap">
          <div id="clueBar" class="clue-bar">🔍 目标特征加载中</div>
        </div>
        <div class="status-strip">
          <div class="status-chip">
            <span class="status-label">时间</span>
            <strong id="timerText">90</strong>
          </div>
          <div class="status-chip danger">
            <span id="attemptLabel" class="status-label">出拳</span>
            <strong id="attemptText">3</strong>
          </div>
          <button id="pauseButton" class="pause-button" type="button" aria-label="暂停">⏸</button>
        </div>
      </section>

      <section class="controls">
        <div id="joystick" class="joystick" aria-label="虚拟摇杆">
          <div id="joystickKnob" class="joystick-knob"></div>
        </div>
        <button id="attackButton" class="attack-button" type="button" aria-label="干爆">
          <span>拳</span>
          <div id="cooldownOverlay" class="cooldown-overlay"></div>
        </button>
      </section>
    </main>

    <!-- 暂停弹窗 -->
    <section id="pauseModal" class="modal">
      <div class="modal-panel">
        <div class="modal-title">⏸ 暂停</div>
        <p class="modal-copy pause-copy">人生暂停，梗哥原地待机</p>
        <div class="task-actions">
          <button id="resumeButton" class="primary-button" type="button">继续体验</button>
          <button id="backFromPauseButton" class="secondary-button" type="button">返回坐标轴</button>
        </div>
      </div>
    </section>

    <!-- 人生事件轴（关卡入口） -->
    <section id="historyTimelineModal" class="modal history-timeline-modal" aria-label="人生事件轴">
      <div class="history-cosmos">
        <header class="history-header">
          <div class="history-title-group">
            <div class="history-kicker">人生事件轴</div>
            <!-- 半生通关入口：主线全通后出现，点击查看人生线报告（未全 A 时锁定） -->
            <button id="lifeReportEntry" class="life-report-entry" type="button" hidden aria-label="查看人生线报告">
              <span class="life-report-entry-text">半生通关</span>
            </button>
          </div>
          <div class="history-header-actions">
            <div class="history-build-meta">
              <span id="historyVersionText">v0.10.x.1</span>
              <span id="historyStampText">2026.06.18</span>
            </div>
            <div class="difficulty-picker" aria-label="体验难易程度">
              <span class="difficulty-label">难度</span>
              <div class="difficulty-options" role="group" aria-label="选择体验难度">
                <button class="difficulty-option" type="button" data-difficulty="easy" aria-pressed="true">易</button>
                <button class="difficulty-option" type="button" data-difficulty="medium" aria-pressed="false">中</button>
                <button class="difficulty-option" type="button" data-difficulty="hard" aria-pressed="false">难</button>
              </div>
            </div>
            <button id="settingsButton" class="settings-button" type="button" aria-expanded="false" aria-controls="settingsPanel">
              设置
            </button>
          </div>
        </header>

        <div id="settingsPanel" class="settings-panel" hidden>
          <button class="settings-panel-backdrop" id="settingsPanelBackdrop" type="button" aria-label="关闭设置"></button>
          <div class="settings-panel-card" role="dialog" aria-modal="true" aria-label="体验设置">
            <div class="settings-panel-title">设置</div>
            <div class="settings-panel-list">
              <div class="difficulty-picker preference-picker" aria-label="音效开关">
                <span class="difficulty-label">音效</span>
                <div class="difficulty-options" role="group" aria-label="选择音效开关">
                  <button class="difficulty-option" type="button" data-pref="sfx" data-value="on" aria-pressed="true">on</button>
                  <button class="difficulty-option" type="button" data-pref="sfx" data-value="off" aria-pressed="false">off</button>
                </div>
              </div>
              <div class="difficulty-picker preference-picker" aria-label="音乐开关">
                <span class="difficulty-label">音乐</span>
                <div class="difficulty-options" role="group" aria-label="选择音乐开关">
                  <button class="difficulty-option" type="button" data-pref="music" data-value="on" aria-pressed="true">on</button>
                  <button class="difficulty-option" type="button" data-pref="music" data-value="off" aria-pressed="false">off</button>
                </div>
              </div>
              <div class="difficulty-picker preference-picker" aria-label="震动开关">
                <span class="difficulty-label">震动</span>
                <div class="difficulty-options" role="group" aria-label="选择震动开关">
                  <button class="difficulty-option" type="button" data-pref="vibration" data-value="on" aria-pressed="true">on</button>
                  <button class="difficulty-option" type="button" data-pref="vibration" data-value="off" aria-pressed="false">off</button>
                </div>
              </div>
            </div>
            <button id="settingsCloseButton" class="secondary-button settings-close-button" type="button">关闭</button>
          </div>
        </div>

        <div id="historyViewport" class="history-viewport" aria-label="历史节点进度">
          <div id="historyTrack" class="history-track"></div>
        </div>

        <footer class="history-footer">
          <div id="historyStatusText" class="history-status-text">历史仍在等待记录……</div>
          <div id="historyNodeDetail" class="history-node-detail" aria-live="polite"></div>
        </footer>

        <section id="historyDetailModal" class="history-detail-modal" aria-label="历史节点详情">
          <div id="historyDetailBackdrop" class="history-detail-backdrop" aria-hidden="true"></div>
          <article id="historyDetailPanel" class="history-detail-panel">
            <header class="history-detail-header">
              <h2 id="historyDetailTitle">第1章 - 凌晨三点</h2>
              <p id="historyDetailSubtitle">历史节点</p>
            </header>
            <div class="history-detail-body">
              <button id="historyDetailPrev" class="history-detail-nav prev" type="button" aria-label="上一个历史节点">‹</button>
              <div class="history-detail-share">
                <canvas id="historyDetailShareCanvas" class="history-detail-share-canvas" width="540" height="960"></canvas>
              </div>
              <div class="history-detail-side">
                <div id="historyDetailLore" class="history-detail-lore" tabindex="0"></div>
                <div id="historyDetailStats" class="history-detail-stats"></div>
              </div>
              <button id="historyDetailNext" class="history-detail-nav next" type="button" aria-label="下一个历史节点">›</button>
            </div>
            <footer class="history-detail-footer">
              <div class="history-detail-actions">
                <button id="historyDetailSave" class="history-detail-button" type="button">保存</button>
                <button id="historyDetailClose" class="history-detail-button ghost" type="button">关闭</button>
                <button id="historyDetailReplay" class="history-detail-button accent" type="button">再玩一局</button>
              </div>
              <div id="historyDetailReward" class="history-detail-reward"></div>
            </footer>
          </article>
        </section>
      </div>
    </section>

    <!-- 关卡进入卡 -->
    <section id="taskModal" class="modal">
      <div class="modal-panel task-panel">
        <div id="taskTitle" class="modal-title task-entry-title">任务</div>
        <div class="target-preview-wrap">
          <canvas id="targetPreviewCanvas" class="target-preview-canvas" width="200" height="220"></canvas>
          <div class="target-callout">认准这个目标！！</div>
        </div>
        <div id="taskTraits" class="task-traits"></div>
        <div class="task-info-row">
          <div class="task-info-chip"><img class="task-info-icon" src="/src/assets/ui/icon-clock.png" alt=""> <span id="taskTime">90</span> 秒</div>
          <div class="task-info-chip" id="taskAttemptsChip"><img class="task-info-icon" src="/src/assets/ui/icon-fist.png" alt=""> <span id="taskAttempts">--</span></div>
          <div class="task-info-chip"><img class="task-info-icon" src="/src/assets/ui/icon-bolt.png" alt=""> <span id="taskDifficulty">难度 · 新手</span></div>
        </div>
        <div class="task-actions">
          <button id="backFromTaskButton" class="secondary-button" type="button">返回坐标轴</button>
          <button id="startButton" class="primary-button" type="button">开始整活</button>
        </div>
      </div>
    </section>

    <!-- 进入关卡后的打字机剧情弹窗 -->
    <section id="storyIntroModal" class="story-intro-modal" aria-label="剧情简报">
      <div class="story-intro-stage">
        <div id="storyIntroText" class="story-intro-text" aria-live="polite"></div>
        <div id="storyIntroHint" class="story-intro-hint" hidden>点击屏幕任意处，开始重拳出击！</div>
      </div>
    </section>

    <!-- 结算弹窗：仿分享卡的窄版竖卡，插画+等级+通关数据 -->
    <section id="resultModal" class="modal result-modal">
      <div class="result-stage">
        <div id="resultArt" class="result-art" aria-hidden="true"></div>
        <div class="result-slug">
          <span id="resultLevelTag" class="result-slug-item">LV.01</span>
          <span id="resultAgeTag" class="result-slug-item">--</span>
          <span id="resultRating" class="result-rating">S</span>
        </div>
        <div class="result-brief">
          <div id="resultTitle" class="result-outcome">结算</div>
          <div id="resultNodeTitle" class="result-node-title"></div>
          <p id="resultCopy" class="result-verdict">结果加载中</p>
          <div class="result-stats">
            <div class="stat-row"><span>⏱ 用时</span><strong id="statTime">--</strong></div>
            <div class="stat-row"><span id="statAttemptsLabel">🥊 剩余出拳</span><strong id="statAttempts">--</strong></div>
          </div>
          <div id="resultUnlock" class="result-unlock"></div>
          <div class="result-actions">
            <button id="retryButton" class="primary-button" type="button">再来一局</button>
            <button id="shareButton" class="secondary-button share-button" type="button">生成分享卡</button>
            <button id="backToSelectButton" class="secondary-button" type="button">返回坐标轴</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 人生线报告：五关全部 A 级及以上时弹出一次，独立于历史节点与番外解锁 -->
    <section id="lifeReportModal" class="modal result-modal life-report-modal" aria-label="人生线报告">
      <div class="result-stage life-report-card">
        <div id="lifeReportArt" class="result-art life-report-art" aria-hidden="true"></div>
        <div class="result-slug">
          <span class="result-slug-item">人生线报告</span>
          <span id="lifeReportProgress" class="result-slug-item">5/5</span>
        </div>
        <div class="result-brief life-report-brief">
          <div class="result-outcome">五关全优 · 半生高光</div>
          <div class="result-node-title life-report-title">妈妈，人生是旷野！</div>
          <div id="lifeReportRows" class="life-report-rows"></div>
          <p class="result-verdict life-report-footnote">每一关都拿下 A 级以上——这半生，梗哥走得漂亮。</p>
          <div class="result-actions">
            <button id="lifeReportConfirmButton" class="primary-button" type="button">收下这份人生 ▶</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 分享卡弹窗 -->
    <section id="shareModal" class="modal">
      <div class="modal-panel share-panel">
        <div class="modal-title">📤 人生分享卡</div>
        <div class="share-canvas-wrap">
          <canvas id="shareCanvas" class="share-canvas" width="540" height="960"></canvas>
        </div>
        <div class="task-actions">
          <button id="saveShareButton" class="primary-button" type="button">保存图片</button>
          <button id="closeShareButton" class="secondary-button" type="button">关闭</button>
        </div>
      </div>
    </section>

    <!-- 进入体验前的加载页 -->
    <section id="prelaunchScreen" class="prelaunch-screen">
      <div class="prelaunch-bottom">
        <button id="prelaunchStartButton" class="prelaunch-start" type="button">
          <span class="prelaunch-start-text">开始体验</span>
        </button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
